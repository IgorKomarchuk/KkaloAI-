# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# UTF-8 + sun.jnu.encoding needed for paths with non-ASCII chars (e.g. C:\Users\Игорь\)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# Use AndroidX (required for all modern Android libraries)
android.useAndroidX=true

# Enables Kotlin coroutines
kotlin.coroutines=enable

# Enables new Jetpack Paging API and lifecycle support
android.enableBuildConfigAsBytecode=false

# Suppress warnings for API 35 on current AGP
android.suppressUnsupportedCompileSdk=35

# Jetpack Compose compiler metrics (optional, helps debugging)
# kotlin.compose.compiler.reports=true

org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin daemon падає на шляхах з кирилицею (C:\Users\Игорь\) — білдимо в in-process.
# Трохи повільніше, але без помилок "Could not connect to Kotlin compile daemon".
kotlin.compiler.execution.strategy=in-process
