<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="100%" style="stop-color:#00c853"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#00b248"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="60" height="30" rx="12" fill="white" opacity="0.08"/>

  <!-- Camera body outline -->
  <rect x="10" y="20" width="44" height="30" rx="6" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- Camera lens outer ring -->
  <circle cx="32" cy="35" r="10" fill="none" stroke="white" stroke-width="3"/>

  <!-- Camera lens inner -->
  <circle cx="32" cy="35" r="5" fill="white" opacity="0.9"/>

  <!-- Camera bump (top) -->
  <rect x="24" y="14" width="16" height="8" rx="3" fill="white" opacity="0.95"/>

  <!-- Flash dot -->
  <circle cx="48" cy="26" r="2.5" fill="white" opacity="0.9"/>

  <!-- AI scan corner lines (AR feel) -->
  <!-- top-left -->
  <path d="M13 23 L13 27 M13 23 L17 23" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
  <!-- top-right -->
  <path d="M51 23 L51 27 M51 23 L47 23" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
  <!-- bottom-left -->
  <path d="M13 47 L13 43 M13 47 L17 47" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
  <!-- bottom-right -->
  <path d="M51 47 L51 43 M51 47 L47 47" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
</svg>
