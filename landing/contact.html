<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Contact KkaloAI | Support & Inquiries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10B981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --glass: rgba(255, 255, 255, 0.03);
            --accent: #34D399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .bg-glow {
            position: fixed;
            width: 800px; height: 800px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: -1; filter: blur(100px); opacity: 0.2; pointer-events: none;
        }
        .glow-1 { top: -300px; right: -200px; }
        .glow-2 { bottom: -300px; left: -200px; }

        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            background: rgba(3, 7, 18, 0.7);
        }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; color: var(--primary); text-decoration: none; }
        .logo span { color: #fff; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 160px 20px 100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .contact-info h1 {
            font-size: 64px;
            font-weight: 950;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff 50%, var(--primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .contact-info p { font-size: 20px; color: var(--text-muted); margin-bottom: 40px; }

        .email-box {
            background: var(--glass);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            display: inline-flex;
            flex-direction: column;
            gap: 8px;
        }
        .email-box span { color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; }
        .email-box a { color: var(--primary); font-size: 24px; font-weight: 800; text-decoration: none; }

        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 48px;
            border-radius: 32px;
            backdrop-filter: blur(20px);
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-main); }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--primary);
            color: #064e3b;
            box-shadow: 0 10px 30px var(--primary-glow);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px var(--primary-glow);
        }

        footer {
            padding: 60px 5%;
            border-top: 1px solid var(--card-border);
            text-align: center;
        }
        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; padding-top: 120px; text-align: center; }
            .contact-info h1 { font-size: 48px; }
            .email-box { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <nav>
        <a href="index.html" class="logo">Kkalo<span>AI</span></a>
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600;">← Back to Home</a>
    </nav>

    <div class="container">
        <div class="contact-info">
            <h1>Get in touch</h1>
            <p>Have a question about KkaloAI? Our team is here to help you on your health journey.</p>
            
            <div class="email-box">
                <span>Direct Support</span>
                <a href="mailto:isktrend@gmail.com">isktrend@gmail.com</a>
            </div>
        </div>

        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <p id="successMsg" style="display:none; color: var(--primary); text-align:center; margin-top: 20px; font-weight: 700;">Message sent! We'll get back to you soon.</p>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="index.html">Terms of Service</a>
            <a href="index.html">Home</a>
        </div>
        <p style="color: var(--text-muted); font-size: 14px;">&copy; 2026 KkaloAI. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            this.style.opacity = '0.3';
            this.style.pointerEvents = 'none';
            document.getElementById('successMsg').style.display = 'block';
        });
    </script>
</body>
</html>
